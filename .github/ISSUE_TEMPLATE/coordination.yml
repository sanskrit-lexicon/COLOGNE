name: Coordination
description: Track a cross-repo coordination item
title: "[coordination] "
labels: ["coordination"]
body:
  - type: input
    id: repos_affected
    attributes:
      label: Repos affected
      description: Which repositories does this coordination item concern?
      placeholder: "e.g. MWS, csl-pywork, csl-app"
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be coordinated across repos?
    validations:
      required: true
  - type: textarea
    id: action_items
    attributes:
      label: Action items
      description: List the specific steps or decisions required
